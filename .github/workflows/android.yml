name: Android APK
on:
  push:
    branches: [main, "feat/gicore-offline-ai-v2"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin a stable hosted image; ubuntu-latest can move between SDK layouts.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          set -eux
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Verify Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Fetch pinned llama.cpp source
        run: |
          git clone --depth 1 --branch b4514 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          test -f app/src/main/cpp/llama.cpp/CMakeLists.txt
          git -C app/src/main/cpp/llama.cpp rev-parse --short HEAD

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK (ARMv7)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK ABI and package
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/.*\\.so'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GI-Core-AI-v2-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
